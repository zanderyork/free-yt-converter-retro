[package]
name = "retro-yt-mp3"
version = "1.0.0"
description = "RetroTube — local YouTube to MP3/MP4 converter with a retro Win2K/XP aesthetic."
authors = ["RetroTube"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "retro_yt_mp3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
tauri-plugin-shell = "2.3"
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
once_cell = "1.20"
parking_lot = "0.12"
tokio = { version = "1", features = ["time", "sync"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
